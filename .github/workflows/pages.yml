name: Publish portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify the reviewed static build
        shell: bash
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/JohnBarsisa/johnportfolio-pages/releases/download/v1.0.2/jk-portfolio-pages-v1.0.2.tar.gz \
            --output site.tar.gz
          printf '%s\n' '7d511021c16e9975eb9829d89ad661674f1b5acd031e3cc0ca9e2fa410dab894  site.tar.gz' | sha256sum --check
          mkdir public
          tar --extract --gzip --file site.tar.gz --directory public --no-same-owner --no-same-permissions
          test -s public/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
