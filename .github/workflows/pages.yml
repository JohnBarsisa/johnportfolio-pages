name: Publish portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download and verify the reviewed static build
        shell: bash
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/JohnBarsisa/johnportfolio-pages/releases/download/v1.0.1/jk-portfolio-pages-v1.0.1.tar.gz \
            --output site.tar.gz
          printf '%s\n' 'd3a3905f789c3d628bcb058d4f7cfc3058fb801ded003ed56c93fcdbd53fe814  site.tar.gz' | sha256sum --check
          mkdir public
          tar --extract --gzip --file site.tar.gz --directory public --no-same-owner --no-same-permissions
          test -s public/index.html
      - name: Install the shared tech-stack pad on the portfolio home page
        run: |
          node --check enhancements/tech-stack-pad.js
          cp enhancements/tech-stack-pad.js public/
          python3 - <<'PY'
          from pathlib import Path
          page = Path('public/index.html')
          html = page.read_text()
          assert '</body>' in html
          page.write_text(html.replace('</body>', '<script defer src="./tech-stack-pad.js"></script></body>', 1))
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Check the deployed portfolio in Chrome
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          cd "$RUNNER_TEMP"
          npm install --no-save --ignore-scripts playwright-core@1.55.0
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright-core';
          const browser = await chromium.launch({channel:'chrome',args:['--no-sandbox']});
          try {
            for (const width of [390,1280]) {
              const page = await browser.newPage({viewport:{width,height:850},reducedMotion:'reduce'});
              const response = await page.goto(process.env.PAGE_URL + '#experience');
              assert.equal(response.status(),200);
              await page.locator('section#experience').waitFor({state:'attached'});
              const pad = page.locator('section#skills[data-pad-ready]');
              await pad.waitFor();
              await pad.evaluate(el => el.scrollIntoView({block:'center',behavior:'instant'}));
              const buttons = pad.locator('.jk-pad-key');
              assert.equal(await buttons.count(),25);
              await buttons.nth(2).click();
              await page.waitForFunction(() => document.querySelector('.jk-pad-detail strong')?.textContent.includes('React'));
              await page.keyboard.press('1');
              await page.waitForFunction(() => document.querySelector('.jk-pad-detail strong')?.textContent.includes('JavaScript'));
              await pad.getByRole('button',{name:'Next pad'}).click();
              await page.waitForFunction(() => document.querySelector('.jk-pad-detail strong')?.textContent.includes('TypeScript'));
              await page.close();
            }
          } finally { await browser.close(); }
          JS
